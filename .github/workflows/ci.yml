name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: spice-framework/.github/.github/workflows/go-verify.yml@0534fe1247f892b287f624b7abb6f2347765ab22
    with:
      go-version: 1.26.5

  quality:
    name: Repository quality contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Run complete local quality contract
        run: go run ./internal/qualitygate -mode=verify

  core-compatibility:
    name: Spice core (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        line: [minimum, current]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Verify the ${{ matrix.line }} core line
        run: go run ./internal/corecompat -line=${{ matrix.line }}

  postgres:
    name: PostgreSQL 18.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: spice
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: spice-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Exercise real PostgreSQL behavior
        env:
          SPICE_POSTGRES_TEST_URL: postgres://postgres:spice-test@127.0.0.1:5432/spice?sslmode=disable
        run: go test -tags=integration -race -shuffle=on -count=1 ./...

  release-parity:
    name: Release parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOWORK: 'off'
      GOPROXY: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=vendor
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Compare central and retained release builders
        run: go run ./internal/qualitygate -mode=release-parity

  required:
    name: Required CI
    if: always()
    needs: [verify, quality, core-compatibility, postgres, release-parity]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CORE_COMPATIBILITY_RESULT: ${{ needs.core-compatibility.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          RELEASE_PARITY_RESULT: ${{ needs.release-parity.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$CORE_COMPATIBILITY_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"
          test "$RELEASE_PARITY_RESULT" = "success"
